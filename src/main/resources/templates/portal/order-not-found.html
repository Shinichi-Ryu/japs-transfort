<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: htmlHead('Order Not Found')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Order Not Found - Japs Transfort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
    <link rel="stylesheet" th:href="@{/css/lists.css}" href="/css/lists.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <div class="app">
        <!-- Mobile Drawer Backdrop -->
        <div class="sb-backdrop" onclick="window.jtToggleDrawer(false)" aria-hidden="true"></div>

        <!-- Sidebar -->
        <aside th:replace="~{fragments/layout :: sidebar('orders', 'reseller')}"></aside>

        <!-- Main Content Area -->
        <div class="mw">
            <!-- Background effects -->
            <div th:replace="~{fragments/layout :: bgfx}"></div>

            <!-- Sticky Topbar -->
            <header th:replace="~{fragments/layout :: topbar('Order Not Found', 'reseller')}"></header>

            <main>
                <div class="row justify-content-center my-5">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card jt-card p-5 text-center">
                            <div class="mb-3">
                                <i class="bi bi-file-earmark-x" style="font-size: 3.5rem; color: var(--mu);"></i>
                            </div>
                            <h2 class="fw-bold mb-2" style="color: var(--tx);">Order Not Found</h2>
                            <p class="mb-4" style="color: var(--mu);">
                                The order you are looking for does not exist or you do not have permission to view it.
                            </p>
                            <div>
                                <a th:href="@{/portal/orders}" class="jt-btn jt-btn-p d-inline-flex align-items-center">
                                    <i class="bi bi-arrow-left me-1"></i> Back to My Orders
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Command Palette -->
        <div th:replace="~{fragments/layout :: commandPalette('reseller')}"></div>
    </div>

    <!-- Bootstrap 5 JS & Layout scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
