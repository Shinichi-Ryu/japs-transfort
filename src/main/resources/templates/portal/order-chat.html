<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: htmlHead('Chat – Order ' + ${order.orderNo})}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Chat</title>
</head>
<body>
    <div class="app">
        <div class="sb-backdrop" onclick="window.jtToggleDrawer(false)" aria-hidden="true"></div>
        <aside th:replace="~{fragments/layout :: sidebar('orders', 'reseller')}"></aside>
        <div class="mw">
            <div th:replace="~{fragments/layout :: bgfx}"></div>
            <header th:replace="~{fragments/layout :: topbar('Chat – Order ' + ${order.orderNo}, 'reseller')}"></header>
            <main>
                <div class="jt-ph">
                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <a th:href="@{'/portal/orders/' + ${order.orderId}}" class="jt-btn jt-btn-s jt-btn-ghost">
                            <i class="bi bi-arrow-left me-1"></i> Back to order
                        </a>
                    </div>
                </div>

                <!-- Flash Messages -->
                <div th:if="${successMessage}" class="jt-alert jt-alert-success alert alert-dismissible fade show mb-4" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}">Success</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="jt-alert jt-alert-danger alert alert-dismissible fade show mb-4" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">Error</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Header Card -->
                <div class="jt-card mb-4 order-chat-header-card">
                    <div style="padding: 16px 24px;">
                        <div class="d-flex flex-wrap align-items-center gap-3">
                            <div>
                                <div class="small" style="color: var(--mu);">Order Number</div>
                                <div class="fw-bold font-monospace" style="color: var(--navy);" th:text="${order.orderNo}">ORD-0001</div>
                            </div>
                            <div>
                                <div class="small" style="color: var(--mu);">Status</div>
                                <span class="pill"
                                      th:classappend="${order.status == null ? 'gr' : (order.status.name() == 'pending' ? 'y' : (order.status.name() == 'approved' ? 'b' : (order.status.name() == 'packed' ? 'b' : (order.status.name() == 'shipped' ? 'b' : (order.status.name() == 'delivered' ? 'g' : (order.status.name() == 'cancelled' ? 'r' : 'gr'))))))}"
                                      th:text="${order.status}">pending</span>
                            </div>
                            <div>
                                <div class="small" style="color: var(--mu);">Order Date</div>
                                <div class="fw-medium" th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A'}">2026-01-01</div>
                            </div>
                            <div>
                                <div class="small" style="color: var(--mu);">Items</div>
                                <div class="fw-medium" th:text="${order.items != null ? order.items.size() : 0}">0</div>
                            </div>
                            <div>
                                <div class="small" style="color: var(--mu);">Total</div>
                                <div class="fw-bold font-monospace" th:text="${order.total != null ? '₱' + #numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT') : '₱0.00'}">₱0.00</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chat Card -->
                <div class="jt-card order-messages-card mb-0 order-chat-card">
                    <div class="jt-card-header">
                        <h6><i class="bi bi-chat-dots me-2" style="color: var(--navy);"></i> Messages</h6>
                    </div>
                    <div class="order-messages-thread order-chat-thread" id="chatThread">
                        <div th:if="${orderMessages == null or #lists.isEmpty(orderMessages)}" class="order-msg-empty">
                            No messages yet. Send the first message below.
                        </div>
                        <div th:each="msg : ${orderMessages}"
                             class="order-msg-row"
                             th:classappend="${msg.senderRole == 'RESELLER' ? 'own' : 'other'}">
                            <div class="order-msg-bubble">
                                <div class="order-msg-meta">
                                    <span class="order-msg-sender" th:text="${msg.senderRole == 'RESELLER' ? 'You' : 'Admin'}">Sender</span>
                                    <span class="order-msg-time"
                                          th:text="${msg.createdAt != null ? #temporals.format(msg.createdAt, 'yyyy-MM-dd HH:mm') : ''}">2026-10-30 10:00</span>
                                </div>
                                <div class="order-msg-body" th:text="${msg.body}">Message text</div>
                            </div>
                        </div>
                    </div>
                    <div class="order-messages-composer order-chat-composer">
                        <form th:action="@{'/portal/orders/' + ${order.orderId} + '/messages'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <textarea name="body" id="portalChatBody" class="jt-input order-msg-textarea"
                                      rows="3" maxlength="1000" required
                                      placeholder="Type a message to admin…"
                                      th:text="${typedMessage != null ? typedMessage : ''}"></textarea>
                            <div class="order-messages-footer">
                                <div class="order-msg-counter"><span id="portalChatCharCount">0</span>/1000</div>
                                <button type="submit" class="jt-btn jt-btn-p jt-btn-s">
                                    <i class="bi bi-send me-1"></i> Send
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
        <div th:replace="~{fragments/layout :: commandPalette('reseller')}"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
    (function() {
        var thread = document.getElementById('chatThread');
        if (thread) { thread.scrollTop = thread.scrollHeight; }
        var ta = document.getElementById('portalChatBody');
        var counter = document.getElementById('portalChatCharCount');
        if (ta && counter) {
            var upd = function() { counter.textContent = ta.value.length; };
            ta.addEventListener('input', upd);
            upd();
        }
    })();
    </script>
</body>
</html>
