# ===================================================================
# Local Development Profile (application-dev.properties)
# ===================================================================

# Database Connection via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/distributor_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# Automatically update schema for new fields/tables without dropping anything
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Template Engine (caching disabled for live dev updates)
spring.thymeleaf.cache=false

# Server Configuration
server.port=8080
server.error.whitelabel.enabled=false
