<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tier - Japs Transfort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: headerNav('tiers')}"></div>

    <div class="container py-4">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Edit Tier</h3>
                <p class="text-muted small mb-0">Update tier details</p>
            </div>
            <a th:href="@{/admin/tiers}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Tiers
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">
                <div class="card table-card">
                    <div class="card-header table-header">
                        <h6 class="fw-bold mb-0"><i class="bi bi-pencil me-1"></i> Tier Details</h6>
                    </div>
                    <div class="card-body">
                        <form th:action="@{'/admin/tiers/edit/' + ${tierFormDto.tierId}}"
                              th:object="${tierFormDto}"
                              method="post">

                            <div class="mb-3">
                                <label for="tierName" class="form-label small fw-medium">Tier Name</label>
                                <input type="text"
                                       class="form-control"
                                       id="tierName"
                                       th:field="*{tierName}"
                                       placeholder="e.g. Bronze, Silver, Gold"
                                       th:errorclass="is-invalid"
                                       maxlength="30"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('tierName')}" th:errors="*{tierName}">
                                    Tier name is required.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="discountPct" class="form-label small fw-medium">Discount %</label>
                                <input type="number"
                                       class="form-control"
                                       id="discountPct"
                                       th:field="*{discountPct}"
                                       placeholder="0.00"
                                       step="0.01"
                                       min="0"
                                       max="100"
                                       th:errorclass="is-invalid"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('discountPct')}" th:errors="*{discountPct}">
                                    Enter a valid discount (0–100).
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="commissionPct" class="form-label small fw-medium">Commission %</label>
                                <input type="number"
                                       class="form-control"
                                       id="commissionPct"
                                       th:field="*{commissionPct}"
                                       placeholder="0.00"
                                       step="0.01"
                                       min="0"
                                       max="100"
                                       th:errorclass="is-invalid"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('commissionPct')}" th:errors="*{commissionPct}">
                                    Enter a valid commission (0–100).
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="minMonthlyPurchase" class="form-label small fw-medium">Min Monthly Purchase</label>
                                <div class="input-group">
                                    <span class="input-group-text small">₱</span>
                                    <input type="number"
                                           class="form-control"
                                           id="minMonthlyPurchase"
                                           th:field="*{minMonthlyPurchase}"
                                           placeholder="0.00"
                                           step="0.01"
                                           min="0"
                                           th:errorclass="is-invalid"
                                           required>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('minMonthlyPurchase')}" th:errors="*{minMonthlyPurchase}">
                                    Enter a valid amount (≥ 0).
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                                    <i class="bi bi-check-lg me-1"></i> Save Changes
                                </button>
                                <a th:href="@{/admin/tiers}" class="btn btn-outline-secondary btn-sm">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
