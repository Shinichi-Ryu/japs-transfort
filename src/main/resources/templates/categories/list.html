<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Japs Transfort</title>
    <!-- Google Fonts: Plus Jakarta Sans with system-ui fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
    <!-- Lists CSS (linked after theme.css) -->
    <link rel="stylesheet" th:href="@{/css/lists.css}" href="/css/lists.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <!-- Inline appearance script before first paint to prevent flash -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('jt.theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                var pal = localStorage.getItem('jt.pal') || 'teal';
                var bg = localStorage.getItem('jt.bg') || 'none';
                var motion = localStorage.getItem('jt.motion') || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'still' : 'animated');
                var sidebar = localStorage.getItem('jt.sidebar') || 'full';
                var doc = document.documentElement;
                doc.setAttribute('data-theme', theme);
                doc.setAttribute('data-bs-theme', theme);
                doc.setAttribute('data-pal', pal);
                doc.setAttribute('data-bg', bg);
                doc.setAttribute('data-motion', motion);
                doc.setAttribute('data-sidebar', sidebar);
                if (sidebar === 'mini') doc.classList.add('mini');
                if (motion === 'still') doc.classList.add('still');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="app">
        <!-- Drawer backdrop for mobile screens -->
        <div class="sb-backdrop" onclick="window.jtToggleDrawer(false)" aria-hidden="true"></div>

        <!-- Sidebar -->
        <aside th:replace="~{fragments/layout :: sidebar('categories', 'admin')}"></aside>

        <!-- Main Content Area -->
        <div class="mw">
            <!-- Background effects -->
            <div th:replace="~{fragments/layout :: bgfx}"></div>

            <!-- Sticky Topbar -->
            <header th:replace="~{fragments/layout :: topbar('Categories', 'admin')}"></header>

            <main class="container-fluid px-4 py-4">
                <!-- Page Header -->
                <div class="jt-ph">
                    <div>
                        <h1>Categories</h1>
                        <div class="jt-sub">Group your products</div>
                    </div>
                    <div class="jt-ph-actions">
                        <a th:href="@{/dashboard}" class="jt-btn jt-btn-s">
                            <i class="bi bi-arrow-left me-1"></i> Dashboard
                        </a>
                    </div>
                </div>

                <!-- Feedback Alert Messages -->
                <div th:if="${successMessage}" class="jt-alert jt-alert-success alert alert-dismissible fade show" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}">Operation successful</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${errorMessage}" class="jt-alert jt-alert-danger alert alert-dismissible fade show" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">An error occurred</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row g-4">
                    <!-- Add New Category Form (Left / Top) -->
                    <div class="col-12 col-lg-4">
                        <div class="jt-card">
                            <div class="jt-table-header">
                                <h6><i class="bi bi-plus-circle me-1"></i> Add Category</h6>
                            </div>
                            <div style="padding: 18px 20px;">
                                <form th:action="@{/admin/categories/create}" th:object="${categoryDto}" method="post">
                                    <div class="mb-3">
                                        <label for="categoryName" class="form-label" style="font-size: 13px; font-weight: 600; color: var(--tx);">Category Name</label>
                                        <input type="text"
                                               class="form-control"
                                               id="categoryName"
                                               th:field="*{name}"
                                               placeholder="e.g. Beverages, Everyday items"
                                               th:errorclass="is-invalid"
                                               required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                            Category name is required.
                                        </div>
                                    </div>
                                    <button type="submit" class="jt-btn jt-btn-p w-100">
                                        <i class="bi bi-check-lg me-1"></i> Save Category
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Categories Table (Right / Bottom) -->
                    <div class="col-12 col-lg-8">
                        <div class="jt-table-wrap">
                            <div class="jt-table-header">
                                <h6><i class="bi bi-tag me-1"></i> Category List</h6>
                                <span class="jt-pill b" th:text="${categories.size()} + ' total'">0 total</span>
                            </div>
                            <div class="jt-table-scroll">
                                <table class="jt-table jt-table-categories">
                                    <thead>
                                        <tr>
                                            <th scope="col" style="width: 80px;">ID</th>
                                            <th scope="col">Name</th>
                                            <th scope="col" class="n">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:if="${#lists.isEmpty(categories)}">
                                            <td colspan="3" style="text-align: center; color: var(--mu); padding: 32px 16px;">
                                                No categories found. Create one using the form.
                                            </td>
                                        </tr>
                                        <tr th:each="cat : ${categories}">
                                            <td style="font-family: monospace; font-size: 13px; font-weight: 600; color: var(--mu);" th:text="${cat.categoryId}">1</td>
                                            <td><b th:text="${cat.name}">General</b></td>
                                            <td class="n">
                                                <div class="jt-action-group justify-content-end">
                                                    <a th:href="@{'/admin/categories/edit/' + ${cat.categoryId}}"
                                                       class="jt-btn jt-btn-s"
                                                       title="Edit Category">
                                                        <i class="bi bi-pencil me-1"></i> Edit
                                                    </a>
                                                    <form th:action="@{'/admin/categories/delete/' + ${cat.categoryId}}"
                                                          method="post"
                                                          class="d-inline m-0 p-0"
                                                          onsubmit="return confirm('Are you sure you want to delete this category? Deletion will be rejected if any product belongs to this category.');">
                                                        <button type="submit" class="jt-btn jt-btn-s jt-btn-d" title="Delete Category">
                                                            <i class="bi bi-trash me-1"></i> Delete
                                                        </button>
                                                    </form>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Command Palette -->
        <div th:replace="~{fragments/layout :: commandPalette('admin')}"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
