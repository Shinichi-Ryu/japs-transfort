spring.application.name=japs-transfort

# Default to dev profile for local development
spring.profiles.active=dev

# Server Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database Connection via environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Application Timezone
app.timezone=Asia/Manila

# Company details for invoice and receipts
app.company.name=Japs Transfort
app.company.address=
app.company.phone=
app.company.email=
app.company.tin=
app.invoice.footer=

# Multipart upload limits for product photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
