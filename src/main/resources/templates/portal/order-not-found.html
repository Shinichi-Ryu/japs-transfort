<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Not Found - Japs Transfort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: resellerNav('orders')}"></div>

    <div class="container-fluid px-4 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 text-center py-5">
                <i class="bi bi-file-earmark-x text-secondary" style="font-size: 4rem;"></i>
                <h3 class="fw-bold mt-3 mb-2">Order Not Found</h3>
                <p class="text-muted mb-4">
                    The order you are looking for does not exist or you do not have permission to view it.
                </p>
                <a th:href="@{/portal/orders}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i> Back to My Orders
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
