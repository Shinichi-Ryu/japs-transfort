<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: htmlHead('Edit Tier')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tier - Japs Transfort</title>
</head>
<body>
    <div class="app">
        <!-- Drawer backdrop for mobile screens -->
        <div class="sb-backdrop" onclick="window.jtToggleDrawer(false)" aria-hidden="true"></div>

        <!-- Sidebar -->
        <aside th:replace="~{fragments/layout :: sidebar('tiers', 'admin')}"></aside>

        <!-- Main Content Area -->
        <div class="mw">
            <!-- Background effects -->
            <div th:replace="~{fragments/layout :: bgfx}"></div>

            <!-- Sticky Topbar -->
            <header th:replace="~{fragments/layout :: topbar('Edit Tier', 'admin')}"></header>

            <main>
                <!-- Page Header -->
                <div class="jt-ph">
                    <div>
                        <h1>Edit Tier</h1>
                        <div class="jt-sub">Update tier details and rates</div>
                    </div>
                    <div class="jt-ph-actions">
                        <a th:href="@{/admin/tiers}" class="jt-btn jt-btn-s">
                            <i class="bi bi-arrow-left me-1"></i> Back to Tiers
                        </a>
                    </div>
                </div>

                <div style="max-width: 560px; margin: 0 auto;">
                    <div class="jt-section-card">
                        <div class="jt-card-header">
                            <h6><i class="bi bi-pencil me-1"></i> Tier Details</h6>
                        </div>
                        <div class="jt-card-body">
                            <form th:action="@{'/admin/tiers/edit/' + ${tierFormDto.tierId}}"
                                  th:object="${tierFormDto}"
                                  method="post">

                                <div class="jt-field">
                                    <label for="tierName" class="jt-label">Tier Name <span class="text-danger">*</span></label>
                                    <input type="text"
                                           class="form-control"
                                           id="tierName"
                                           th:field="*{tierName}"
                                           placeholder="e.g. Bronze, Silver, Gold"
                                           th:errorclass="is-invalid"
                                           maxlength="30"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tierName')}" th:errors="*{tierName}">
                                        Tier name is required.
                                    </div>
                                </div>

                                <div class="jt-field">
                                    <label for="discountPct" class="jt-label">Discount % <span class="text-danger">*</span></label>
                                    <input type="number"
                                           class="form-control"
                                           id="discountPct"
                                           th:field="*{discountPct}"
                                           placeholder="0.00"
                                           step="0.01"
                                           min="0"
                                           max="100"
                                           th:errorclass="is-invalid"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('discountPct')}" th:errors="*{discountPct}">
                                        Enter a valid discount (0–100).
                                    </div>
                                </div>

                                <div class="jt-field">
                                    <label for="commissionPct" class="jt-label">Commission % <span class="text-danger">*</span></label>
                                    <input type="number"
                                           class="form-control"
                                           id="commissionPct"
                                           th:field="*{commissionPct}"
                                           placeholder="0.00"
                                           step="0.01"
                                           min="0"
                                           max="100"
                                           th:errorclass="is-invalid"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('commissionPct')}" th:errors="*{commissionPct}">
                                        Enter a valid commission (0–100).
                                    </div>
                                </div>

                                <div class="jt-field">
                                    <label for="minMonthlyPurchase" class="jt-label">Min Monthly Purchase <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text" style="background-color: var(--soft); color: var(--mu); border-color: var(--line);">₱</span>
                                        <input type="number"
                                               class="form-control"
                                               id="minMonthlyPurchase"
                                               th:field="*{minMonthlyPurchase}"
                                               placeholder="0.00"
                                               step="0.01"
                                               min="0"
                                               th:errorclass="is-invalid"
                                               required>
                                    </div>
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('minMonthlyPurchase')}" th:errors="*{minMonthlyPurchase}">
                                        Enter a valid amount (≥ 0).
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top" style="border-color: var(--line) !important;">
                                    <a th:href="@{/admin/tiers}" class="jt-btn jt-btn-s">
                                        Cancel
                                    </a>
                                    <button type="submit" class="jt-btn jt-btn-p jt-btn-s">
                                        <i class="bi bi-check-lg me-1"></i> Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Command Palette -->
        <div th:replace="~{fragments/layout :: commandPalette('admin')}"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
