<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Japs Transfort</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <!-- Reseller Navigation Bar Fragment -->
    <div th:replace="~{fragments/navbar :: resellerNav('orders')}"></div>

    <div class="container-fluid px-4 py-4">
        <!-- Page Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1 text-dark">My Orders</h3>
                <p class="text-muted mb-0 small">View and track all your wholesale orders placed with Japs Transfort.</p>
            </div>
            <a th:href="@{/portal/catalog}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-cart-plus me-1"></i> New Order
            </a>
        </div>

        <!-- Order Placement Confirmation / Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small mb-4 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
            <span class="fw-medium" th:text="${successMessage}">Order placed successfully!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small mb-4 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Error message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Orders Table Card -->
        <div class="card table-card shadow-sm">
            <div class="card-header table-header d-flex justify-content-between align-items-center">
                <h6 class="fw-bold mb-0"><i class="bi bi-receipt me-1"></i> Order History</h6>
                <span class="badge bg-secondary" th:text="${orders != null ? orders.size() : 0} + ' orders'">0 orders</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="ps-3">Order No</th>
                                <th scope="col">Date Placed</th>
                                <th scope="col">Status</th>
                                <th scope="col" class="text-end pe-3">Total Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${orders == null or orders.empty}">
                                <td colspan="4" class="text-center text-muted py-5">
                                    <div class="mb-2"><i class="bi bi-receipt text-secondary" style="font-size: 2rem;"></i></div>
                                    <div>You haven't placed any orders yet.</div>
                                    <div class="mt-2">
                                        <a th:href="@{/portal/catalog}" class="btn btn-primary btn-sm">
                                            <i class="bi bi-grid me-1"></i> Browse Catalog
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:each="order : ${orders}">
                                <td class="ps-3 fw-mono fw-semibold text-primary" th:text="${order.orderNo}">ORD-20261013-0001</td>
                                <td class="text-muted small" th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A'}">2026-10-13 10:00</td>
                                <td>
                                    <span class="badge text-uppercase"
                                          th:classappend="${order.status.name() == 'pending' ? 'bg-warning text-dark' :
                                                           (order.status.name() == 'approved' ? 'bg-info text-dark' :
                                                           (order.status.name() == 'packed' ? 'bg-primary' :
                                                           (order.status.name() == 'shipped' ? 'bg-primary' :
                                                           (order.status.name() == 'delivered' ? 'bg-success' :
                                                           (order.status.name() == 'cancelled' ? 'bg-danger' : 'bg-secondary')))))}"
                                          th:text="${order.status}">
                                        pending
                                    </span>
                                </td>
                                <td class="text-end pe-3 font-monospace fw-bold text-dark" th:text="'₱' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}">₱0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
