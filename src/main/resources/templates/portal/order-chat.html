<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: htmlHead('Chat – Order ' + ${order.orderNo})}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Chat</title>
</head>
<body class="jt-chat-page">
    <style>
    /* Chat Page Sizing & 100dvh Layout (no page-level scroll) */
    html.jt-chat-html,
    body.jt-chat-page {
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden !important;
        margin: 0;
        padding: 0;
    }
    .jt-chat-app {
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden !important;
    }
    .jt-chat-mw {
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden !important;
        min-height: 0;
    }
    .jt-chat-main {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden !important;
        padding: 12px 24px 16px !important;
        height: 100%;
        max-width: 1240px;
        width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
    }

    /* Top navigation bar */
    .jt-chat-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        flex-shrink: 0;
    }

    /* Flash alerts */
    .jt-chat-alert {
        flex-shrink: 0;
        margin-bottom: 8px !important;
        padding: 8px 14px;
    }

    /* Header Summary Card */
    .order-chat-header-card {
        flex-shrink: 0;
        background-color: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--sh);
        margin-bottom: 8px !important;
    }
    .chat-summary-wrap {
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
    }
    .chat-summary-main-row {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
    }
    .chat-meta-pill-group {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .chat-meta-unit {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
    }
    .chat-meta-lbl {
        font-size: 11px;
        color: var(--mu);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }
    .chat-summary-extra-row {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
    }
    .chat-details-btn {
        display: none;
        background-color: var(--card);
        border: 1px solid var(--line);
        color: var(--tx);
        border-radius: 6px;
        cursor: pointer;
        line-height: 1;
    }

    /* Chat Card */
    .order-chat-card {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background-color: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--sh);
        overflow: hidden;
        margin-bottom: 0 !important;
    }
    .order-chat-card .jt-card-header {
        flex-shrink: 0;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .order-chat-card .jt-card-header h6 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
    }

    /* Thread */
    .order-chat-thread {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        max-height: none !important;
    }

    /* Date Separator */
    .chat-date-separator {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 14px 0 8px;
        position: relative;
        text-align: center;
        width: 100%;
    }
    .chat-date-separator::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background-color: var(--line);
        z-index: 0;
    }
    .chat-date-badge {
        position: relative;
        z-index: 1;
        background-color: var(--card);
        border: 1px solid var(--line);
        color: var(--mu);
        padding: 2px 10px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    /* Message Rows and Groups */
    .order-msg-row {
        display: flex;
        width: 100%;
        animation: chatBubbleFade 0.15s ease-out both;
    }
    @keyframes chatBubbleFade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .order-msg-row.group-start {
        margin-top: 10px;
    }
    .order-msg-row.group-start:first-child {
        margin-top: 0;
    }
    .order-msg-row.group-consecutive {
        margin-top: 3px;
    }
    .order-msg-row.own {
        justify-content: flex-end;
    }
    .order-msg-row.other {
        justify-content: flex-start;
    }

    /* Bubbles */
    .order-msg-bubble {
        max-width: 78%;
        border-radius: 14px;
        padding: 8px 14px;
        box-sizing: border-box;
        word-break: break-word;
        overflow-wrap: anywhere;
    }
    .order-msg-row.own .order-msg-bubble {
        background-color: var(--tb);
        border: 1px solid color-mix(in srgb, var(--tt) 28%, transparent);
        color: var(--tx);
        border-bottom-right-radius: 4px;
    }
    .order-msg-row.other .order-msg-bubble {
        background-color: var(--xb);
        border: 1px solid var(--line);
        color: var(--tx);
        border-bottom-left-radius: 4px;
    }
    .order-msg-row.own.group-consecutive .order-msg-bubble {
        border-top-right-radius: 4px;
    }
    .order-msg-row.other.group-consecutive .order-msg-bubble {
        border-top-left-radius: 4px;
    }
    .order-msg-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
        font-size: 11px;
    }
    .order-msg-sender {
        font-weight: 600;
    }
    .order-msg-row.own .order-msg-sender {
        color: var(--tt);
    }
    .order-msg-row.other .order-msg-sender {
        color: var(--mu);
    }
    .order-msg-time {
        color: var(--mu);
        font-size: 11px;
        white-space: nowrap;
    }
    .order-msg-body {
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        font-size: 14px;
        line-height: 1.45;
    }

    /* Empty state */
    .order-msg-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: auto;
        padding: 28px 16px;
        text-align: center;
        color: var(--mu);
    }
    .chat-empty-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-color: var(--xb);
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        font-size: 20px;
        color: var(--mu);
    }
    .chat-empty-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--tx);
        margin-bottom: 4px;
    }
    .chat-empty-desc {
        font-size: 13px;
        max-width: 320px;
        line-height: 1.4;
        color: var(--mu);
    }

    /* Composer */
    .order-chat-composer {
        flex-shrink: 0;
        padding: 10px 16px 12px;
        border-top: 1px solid var(--line);
        background-color: var(--card);
    }
    .order-msg-textarea {
        width: 100%;
        min-height: 42px;
        max-height: 120px;
        resize: none;
        padding: 8px 12px;
        font-size: 14px;
        line-height: 1.4;
        border-radius: 8px;
        box-sizing: border-box;
        overflow-y: hidden;
    }
    .order-messages-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
    }
    .chat-composer-hint {
        font-size: 11px;
        color: var(--mu);
    }

    /* Mobile media queries */
    @media (max-width: 767.98px) {
        .jt-chat-main {
            padding: 8px 10px 10px !important;
        }
        .jt-chat-nav {
            margin-bottom: 6px;
        }
        .chat-summary-wrap {
            padding: 8px 10px;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }
        .chat-summary-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 6px;
            flex-wrap: nowrap;
        }
        .chat-meta-pill-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            min-width: 0;
            flex: 1 1 auto;
        }
        .chat-meta-unit {
            font-size: 12px;
            gap: 4px;
            white-space: nowrap;
        }
        .chat-meta-lbl {
            display: none;
        }
        .chat-details-btn {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            font-size: 11px;
            height: 24px;
            flex-shrink: 0;
        }
        .chat-details-btn i {
            transition: transform 0.15s ease;
        }
        .chat-details-btn.active i {
            transform: rotate(180deg);
        }
        .chat-summary-extra-row {
            display: none;
            width: 100%;
            padding-top: 6px;
            border-top: 1px dashed var(--line);
            gap: 10px;
        }
        .chat-summary-extra-row.show {
            display: flex;
        }
        .chat-summary-extra-row .chat-meta-lbl {
            display: inline;
        }
        .order-chat-thread {
            padding: 10px 12px;
        }
        .order-msg-bubble {
            max-width: 88%;
        }
        .order-chat-composer {
            padding: 8px 10px 10px;
        }
        .chat-composer-hint {
            display: none;
        }
    }
    </style>

    <div class="app jt-chat-app">
        <div class="sb-backdrop" onclick="window.jtToggleDrawer(false)" aria-hidden="true"></div>
        <aside th:replace="~{fragments/layout :: sidebar('orders', 'reseller')}"></aside>
        <div class="mw jt-chat-mw">
            <div th:replace="~{fragments/layout :: bgfx}"></div>
            <header th:replace="~{fragments/layout :: topbar('Chat – Order ' + ${order.orderNo}, 'reseller')}"></header>
            <main class="jt-chat-main">
                <div class="jt-chat-nav">
                    <a th:href="@{'/portal/orders/' + ${order.orderId}}" class="jt-btn jt-btn-s jt-btn-ghost">
                        <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                        <span th:text="'Back to order'">Back to order</span>
                    </a>
                </div>

                <!-- Flash Messages -->
                <div th:if="${successMessage}" class="jt-alert jt-alert-success alert alert-dismissible fade show jt-chat-alert" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2" aria-hidden="true"></i>
                        <span th:text="${successMessage}">Success</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="jt-alert jt-alert-danger alert alert-dismissible fade show jt-chat-alert" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
                        <span th:text="${errorMessage}">Error</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Compact Summary Header Card -->
                <div class="jt-card order-chat-header-card">
                    <div class="chat-summary-wrap">
                        <div class="chat-summary-main-row">
                            <div class="chat-meta-pill-group">
                                <span class="chat-meta-unit">
                                    <span class="chat-meta-lbl" th:text="'Order'">Order</span>
                                    <span class="fw-bold font-monospace" style="color: var(--navy);" th:text="${order.orderNo}">ORD-0001</span>
                                </span>
                                <span class="chat-meta-unit">
                                    <span class="chat-meta-lbl" th:text="'Status'">Status</span>
                                    <span class="pill"
                                          th:classappend="${order.status == null ? 'gr' : ('pending'.equals(order.status.name()) ? 'y' : ('approved'.equals(order.status.name()) ? 'b' : ('packed'.equals(order.status.name()) ? 'b' : ('shipped'.equals(order.status.name()) ? 'b' : ('delivered'.equals(order.status.name()) ? 'g' : ('cancelled'.equals(order.status.name()) ? 'r' : 'gr'))))))}"
                                          th:text="${order.status}">pending</span>
                                </span>
                                <span class="chat-meta-unit">
                                    <span class="chat-meta-lbl" th:text="'Total'">Total</span>
                                    <span class="fw-bold font-monospace" th:text="${order.total != null ? '₱' + #numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT') : '₱0.00'}">₱0.00</span>
                                </span>
                            </div>
                            <button type="button" class="chat-details-btn" id="portalDetailsBtn" aria-expanded="false" onclick="var p=document.getElementById('portalDetailsPanel'); var open=p.classList.toggle('show'); this.setAttribute('aria-expanded', open); this.classList.toggle('active', open);">
                                <span th:text="'Details'">Details</span>
                                <i class="bi bi-chevron-down ms-1" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="chat-summary-extra-row" id="portalDetailsPanel">
                            <span class="chat-meta-unit">
                                <span class="chat-meta-lbl" th:text="'Date'">Date</span>
                                <span class="fw-medium" th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A'}">2026-01-01</span>
                            </span>
                            <span class="chat-meta-unit">
                                <span class="chat-meta-lbl" th:text="'Items'">Items</span>
                                <span class="fw-medium" th:text="${order.items != null ? order.items.size() : 0}">0</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Chat Card filling available viewport -->
                <div class="jt-card order-messages-card order-chat-card">
                    <div class="jt-card-header">
                        <h6>
                            <i class="bi bi-chat-dots me-2" style="color: var(--navy);" aria-hidden="true"></i>
                            <span th:text="'Messages'">Messages</span>
                        </h6>
                    </div>
                    <div class="order-messages-thread order-chat-thread" id="chatThread">
                        <div th:if="${orderMessages == null or #lists.isEmpty(orderMessages)}" class="order-msg-empty">
                            <div class="chat-empty-icon">
                                <i class="bi bi-chat-dots" aria-hidden="true"></i>
                            </div>
                            <div class="chat-empty-title" th:text="'No messages yet'">No messages yet</div>
                            <div class="chat-empty-desc" th:text="'Have a question or update about this order? Send a message to the admin team below.'">Have a question or update about this order? Send a message to the admin team below.</div>
                        </div>
                        <th:block th:each="msg, iter : ${orderMessages}">
                            <th:block th:with="prevIdx=${iter.index == 0 ? 0 : iter.index - 1},
                                               prevMsg=${orderMessages[prevIdx]},
                                               msgDate=${msg.createdAt != null ? #temporals.format(msg.createdAt, 'yyyy-MM-dd') : ''},
                                               prevDate=${prevMsg.createdAt != null ? #temporals.format(prevMsg.createdAt, 'yyyy-MM-dd') : ''},
                                               isNewDay=${iter.first or !#strings.equals(msgDate, prevDate)},
                                               isNewGroup=${isNewDay or !#strings.equals(msg.senderRole, prevMsg.senderRole)}">

                                <!-- Centered date separator -->
                                <div th:if="${isNewDay}" class="chat-date-separator">
                                    <span class="chat-date-badge" th:if="${msgDate == T(java.time.LocalDate).now().toString()}" th:text="'Today'">Today</span>
                                    <span class="chat-date-badge" th:if="${msgDate == T(java.time.LocalDate).now().minusDays(1).toString()}" th:text="'Yesterday'">Yesterday</span>
                                    <span class="chat-date-badge" th:unless="${msgDate == T(java.time.LocalDate).now().toString() or msgDate == T(java.time.LocalDate).now().minusDays(1).toString()}"
                                          th:text="${msg.createdAt != null ? #temporals.format(msg.createdAt, 'MMMM d, yyyy') : ''}">Date</span>
                                </div>

                                <!-- Message row -->
                                <div class="order-msg-row"
                                     th:classappend="${('RESELLER'.equals(msg.senderRole) ? 'own' : 'other') + (isNewGroup ? ' group-start' : ' group-consecutive')}">
                                    <div class="order-msg-bubble">
                                        <div th:if="${isNewGroup}" class="order-msg-meta">
                                            <span class="order-msg-sender"
                                                  th:text="${'RESELLER'.equals(msg.senderRole) ? 'You' : 'Admin'}">Sender</span>
                                            <span class="order-msg-time"
                                                  th:text="${msg.createdAt != null ? #temporals.format(msg.createdAt, 'HH:mm') : ''}">10:00</span>
                                        </div>
                                        <div class="order-msg-body" th:text="${msg.body}">Message text</div>
                                    </div>
                                </div>
                            </th:block>
                        </th:block>
                    </div>
                    <div class="order-messages-composer order-chat-composer">
                        <form th:action="@{'/portal/orders/' + ${order.orderId} + '/messages'}" method="post" id="portalChatForm">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <textarea name="body" id="portalChatBody" class="jt-input order-msg-textarea"
                                      rows="2" maxlength="3000" required
                                      placeholder="Type a message to admin…"
                                      th:text="${typedMessage != null ? typedMessage : ''}"></textarea>
                            <div class="order-messages-footer">
                                <span class="chat-composer-hint" th:text="'Press Enter to send, Shift+Enter for new line'">Press Enter to send, Shift+Enter for new line</span>
                                <button type="submit" id="portalChatSendBtn" class="jt-btn jt-btn-p jt-btn-s" disabled>
                                    <i class="bi bi-send me-1" aria-hidden="true"></i>
                                    <span th:text="'Send'">Send</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
        <div th:replace="~{fragments/layout :: commandPalette('reseller')}"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
    (function() {
        document.documentElement.classList.add('jt-chat-html');
        var thread = document.getElementById('chatThread');
        if (thread) {
            thread.scrollTop = thread.scrollHeight;
        }

        var form = document.getElementById('portalChatForm');
        var ta = document.getElementById('portalChatBody');
        var sendBtn = document.getElementById('portalChatSendBtn');

        if (form && ta && sendBtn) {
            var isSubmitting = false;

            var autoGrow = function() {
                ta.style.height = 'auto';
                var maxH = 120;
                if (ta.scrollHeight > maxH) {
                    ta.style.height = maxH + 'px';
                    ta.style.overflowY = 'auto';
                } else {
                    ta.style.height = Math.max(ta.scrollHeight, 42) + 'px';
                    ta.style.overflowY = 'hidden';
                }
            };

            var updateSendButton = function() {
                var hasText = ta.value.trim().length > 0;
                sendBtn.disabled = !hasText || isSubmitting;
                autoGrow();
            };

            ta.addEventListener('input', updateSendButton);

            ta.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (ta.value.trim().length > 0 && !isSubmitting) {
                        if (typeof form.requestSubmit === 'function') {
                            form.requestSubmit();
                        } else {
                            form.submit();
                        }
                    }
                }
            });

            form.addEventListener('submit', function(e) {
                if (isSubmitting || ta.value.trim().length === 0) {
                    e.preventDefault();
                    return false;
                }
                isSubmitting = true;
                sendBtn.disabled = true;
            });

            updateSendButton();
        }
    })();
    </script>
</body>
</html>
