<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Japs Transfort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: headerNav('categories')}"></div>

    <div class="container py-4">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Product Categories</h3>
                <p class="text-muted small mb-0">Manage product classification</p>
            </div>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>

        <!-- Feedback Alert Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Operation successful</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">An error occurred</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            <!-- Add New Category Form (Left / Top) -->
            <div class="col-12 col-lg-4">
                <div class="card table-card">
                    <div class="card-header table-header">
                        <h6 class="fw-bold mb-0"><i class="bi bi-plus-circle me-1"></i> Add Category</h6>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/categories/create}" th:object="${categoryDto}" method="post">
                            <div class="mb-3">
                                <label for="categoryName" class="form-label small fw-medium">Category Name</label>
                                <input type="text"
                                       class="form-control"
                                       id="categoryName"
                                       th:field="*{name}"
                                       placeholder="e.g. Beverages, Electronics"
                                       th:errorclass="is-invalid"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Category name is required.
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-sm">
                                <i class="bi bi-check-lg me-1"></i> Save Category
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Categories Table (Right / Bottom) -->
            <div class="col-12 col-lg-8">
                <div class="card table-card">
                    <div class="card-header table-header d-flex justify-content-between align-items-center">
                        <h6 class="fw-bold mb-0"><i class="bi bi-tag me-1"></i> Category List</h6>
                        <span class="badge bg-secondary" th:text="${categories.size()} + ' total'">0 total</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col" class="ps-3">ID</th>
                                        <th scope="col">Name</th>
                                        <th scope="col" class="text-end pe-3">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(categories)}">
                                        <td colspan="3" class="text-center text-muted py-4">
                                            No categories found. Create one using the form.
                                        </td>
                                    </tr>
                                    <tr th:each="cat : ${categories}">
                                        <td class="ps-3 fw-semibold text-secondary" th:text="${cat.categoryId}">1</td>
                                        <td class="fw-medium text-dark" th:text="${cat.name}">General</td>
                                        <td class="text-end pe-3">
                                            <div class="action-buttons">
                                                <a th:href="@{'/admin/categories/edit/' + ${cat.categoryId}}"
                                                   class="btn btn-outline-primary btn-sm"
                                                   title="Edit Category">
                                                    <i class="bi bi-pencil"></i> Edit
                                                </a>
                                                <form th:action="@{'/admin/categories/delete/' + ${cat.categoryId}}"
                                                      method="post"
                                                      class="d-inline"
                                                      onsubmit="return confirm('Are you sure you want to delete this category? Deletion will be rejected if any product belongs to this category.');">
                                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete Category">
                                                        <i class="bi bi-trash"></i> Delete
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
