# ===================================================================
# Local Development Profile (application-dev.properties)
# ===================================================================

# Database Connection via environment variables (with default fallback for local convenience)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/distributor_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# 'none' ensures Hibernate does not modify or drop tables from database/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Template Engine (caching disabled for live dev updates)
spring.thymeleaf.cache=false

# Server Configuration
server.port=8080
