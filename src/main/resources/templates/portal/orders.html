<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Japs Transfort</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <!-- Reseller Navigation Bar Fragment -->
    <div th:replace="~{fragments/navbar :: resellerNav('orders')}"></div>

    <div class="container-fluid px-4 py-4">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1 text-dark">My Orders</h3>
                <p class="text-muted mb-0 small">Track and manage your reseller orders.</p>
            </div>
            <a th:href="@{/portal}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Portal
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-3 p-5 text-center">
            <div class="my-4">
                <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-receipt"></i>
                </div>
                <h4 class="fw-bold text-dark">My Orders</h4>
                <p class="text-muted mb-4">Your order history and live order tracking will be displayed here.</p>
                <a th:href="@{/portal}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Return to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
