<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Page Not Found - Japs Transfort</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}" href="/img/favicon.svg">
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <style>
        :root {
            --jt-err-navy: #0F5257;
            --jt-err-sb: #0A3A40;
            --jt-err-amber: #F5A623;
            --jt-err-amber-hover: #E09612;
            --jt-err-bg: #F0F6F6;
            --jt-err-card: #ffffff;
            --jt-err-line: #E2E8F0;
            --jt-err-tx: #13202E;
            --jt-err-mu: #5A6B7D;
        }
        body.jt-error-page {
            margin: 0;
            padding: 0;
            background-color: var(--jt-err-bg);
            color: var(--jt-err-tx);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .jt-error-card {
            background-color: var(--jt-err-card);
            border: 1px solid var(--jt-err-line);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(10, 58, 64, 0.08);
            max-width: 520px;
            width: 90%;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .jt-error-logo-wrap {
            display: inline-flex;
            margin-bottom: 24px;
        }
        .jt-error-code-badge {
            display: inline-block;
            background-color: rgba(245, 166, 35, 0.15);
            color: #B47306;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .jt-error-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--jt-err-sb);
            margin: 0 0 12px 0;
            line-height: 1.25;
        }
        .jt-error-message {
            font-size: 15px;
            color: var(--jt-err-mu);
            line-height: 1.6;
            margin: 0 0 32px 0;
        }
        .jt-error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .jt-btn-error-primary {
            background-color: var(--jt-err-amber);
            color: #0A3A40;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 160ms ease;
            box-shadow: 0 2px 6px rgba(245, 166, 35, 0.35);
        }
        .jt-btn-error-primary:hover,
        .jt-btn-error-primary:focus {
            background-color: var(--jt-err-amber-hover);
            color: #0A3A40;
            text-decoration: none;
            transform: translateY(-1px);
        }
        .jt-btn-error-secondary {
            background-color: transparent;
            color: var(--jt-err-navy);
            font-weight: 600;
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            border: 1px solid var(--jt-err-line);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 160ms ease;
        }
        .jt-btn-error-secondary:hover,
        .jt-btn-error-secondary:focus {
            background-color: rgba(15, 82, 87, 0.05);
            color: var(--jt-err-sb);
            text-decoration: none;
            border-color: var(--jt-err-navy);
        }
    </style>
</head>
<body class="jt-error-page">
    <div class="jt-error-card">
        <div class="jt-error-logo-wrap">
            <svg width="56" height="56" viewBox="0 0 64 64" role="img" aria-label="Japs Transfort logo">
                <rect width="64" height="64" rx="17" fill="#F5A623"/>
                <path d="M32 12l18 10-18 10-18-10z" fill="#ffffff" fill-opacity="0.55"/>
                <path d="M32 12l18 10v20L32 52 14 42V22zM14 22l18 10 18-10M32 32v20" fill="none" stroke="#0A3A40" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
        </div>

        <div>
            <span class="jt-error-code-badge">Error 404 &bull; Not Found</span>
        </div>

        <h1 class="jt-error-title" th:text="${title}">Page Not Found</h1>

        <p class="jt-error-message" th:text="${message}">
            The page you are looking for does not exist or has been moved.
        </p>

        <div class="jt-error-actions">
            <a th:href="@{/login}" class="jt-btn-error-primary" id="back-to-login-btn">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Back to Login</span>
            </a>
            <a th:href="@{/}" class="jt-btn-error-secondary">
                <i class="bi bi-house"></i>
                <span>Home</span>
            </a>
        </div>
    </div>
</body>
</html>
