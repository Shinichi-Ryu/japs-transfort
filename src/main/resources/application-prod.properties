# ===================================================================
# Production Profile (application-prod.properties)
# Used for hosted PostgreSQL (Supabase / Neon / Render / Railway)
# ===================================================================

# Strict environment variables - will fail fast if credentials are not provided
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# 'validate' verifies schema compatibility without modifying the DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Template Engine (caching enabled for performance)
spring.thymeleaf.cache=true

# Server Configuration
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
