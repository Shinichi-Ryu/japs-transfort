<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: htmlHead('Edit Category')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Category - Japs Transfort</title>
</head>
<body>
    <div class="app">
        <!-- Drawer backdrop for mobile screens -->
        <div class="sb-backdrop" onclick="window.jtToggleDrawer(false)" aria-hidden="true"></div>

        <!-- Sidebar -->
        <aside th:replace="~{fragments/layout :: sidebar('categories', 'admin')}"></aside>

        <!-- Main Content Area -->
        <div class="mw">
            <!-- Background effects -->
            <div th:replace="~{fragments/layout :: bgfx}"></div>

            <!-- Sticky Topbar -->
            <header th:replace="~{fragments/layout :: topbar('Edit Category', 'admin')}"></header>

            <main>
                <!-- Page Header -->
                <div class="jt-ph">
                    <div>
                        <h1>Edit Category</h1>
                        <div class="jt-sub">Update category details</div>
                    </div>
                    <div class="jt-ph-actions">
                        <a th:href="@{/admin/categories}" class="jt-btn jt-btn-s">
                            <i class="bi bi-arrow-left me-1"></i> Back to Categories
                        </a>
                    </div>
                </div>

                <div style="max-width: 560px; margin: 0 auto;">
                    <div class="jt-section-card">
                        <div class="jt-card-header">
                            <h6><i class="bi bi-pencil-square me-1"></i> Category Details</h6>
                        </div>
                        <div class="jt-card-body">
                            <form th:action="@{'/admin/categories/edit/' + ${categoryDto.categoryId}}" th:object="${categoryDto}" method="post">
                                <input type="hidden" th:field="*{categoryId}">

                                <div class="jt-field">
                                    <label for="editCategoryName" class="jt-label">Category Name <span class="text-danger">*</span></label>
                                    <input type="text"
                                           class="form-control"
                                           id="editCategoryName"
                                           th:field="*{name}"
                                           placeholder="Enter category name"
                                           th:errorclass="is-invalid"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                        Category name is required.
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top" style="border-color: var(--line) !important;">
                                    <a th:href="@{/admin/categories}" class="jt-btn jt-btn-s">
                                        Cancel
                                    </a>
                                    <button type="submit" class="jt-btn jt-btn-p jt-btn-s">
                                        <i class="bi bi-check-lg me-1"></i> Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Command Palette -->
        <div th:replace="~{fragments/layout :: commandPalette('admin')}"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
