<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%">
  <!-- Roads Grid - more visible -->
  <g stroke="#7EC8C8" stroke-width="0.35" stroke-opacity="0.22" vector-effect="non-scaling-stroke">
    <line x1="0" y1="12" x2="100" y2="12"/>
    <line x1="0" y1="28" x2="100" y2="28"/>
    <line x1="0" y1="44" x2="100" y2="44"/>
    <line x1="0" y1="58" x2="100" y2="58"/>
    <line x1="0" y1="72" x2="100" y2="72"/>
    <line x1="0" y1="88" x2="100" y2="88"/>
    <line x1="10" y1="0" x2="10" y2="100"/>
    <line x1="22" y1="0" x2="22" y2="100"/>
    <line x1="38" y1="0" x2="38" y2="100"/>
    <line x1="52" y1="0" x2="52" y2="100"/>
    <line x1="68" y1="0" x2="68" y2="100"/>
    <line x1="82" y1="0" x2="82" y2="100"/>
    <line x1="94" y1="0" x2="94" y2="100"/>
  </g>

  <!-- Diagonal roads (like reference) -->
  <g stroke="#7EC8C8" stroke-width="0.25" stroke-opacity="0.14" vector-effect="non-scaling-stroke">
    <line x1="0" y1="0" x2="35" y2="100"/>
    <line x1="20" y1="0" x2="55" y2="100"/>
    <line x1="50" y1="0" x2="85" y2="100"/>
    <line x1="75" y1="0" x2="110" y2="100"/>
    <line x1="0" y1="30" x2="70" y2="0"/>
    <line x1="0" y1="70" x2="100" y2="10"/>
  </g>

  <!-- Faint City Blocks -->
  <g fill="#4ABFBF" fill-opacity="0.10">
    <rect x="12" y="14" width="8" height="12" rx="0.5"/>
    <rect x="24" y="14" width="12" height="12" rx="0.5"/>
    <rect x="40" y="4" width="10" height="22" rx="0.5"/>
    <rect x="70" y="14" width="10" height="12" rx="0.5"/>
    <rect x="84" y="6" width="8" height="20" rx="0.5"/>
    <rect x="12" y="30" width="8" height="12" rx="0.5"/>
    <rect x="40" y="30" width="10" height="12" rx="0.5"/>
    <rect x="54" y="30" width="12" height="12" rx="0.5"/>
    <rect x="70" y="30" width="10" height="26" rx="0.5"/>
    <rect x="12" y="60" width="8" height="10" rx="0.5"/>
    <rect x="24" y="46" width="12" height="10" rx="0.5"/>
    <rect x="40" y="60" width="10" height="10" rx="0.5"/>
    <rect x="54" y="46" width="12" height="24" rx="0.5"/>
    <rect x="84" y="60" width="8" height="26" rx="0.5"/>
    <rect x="24" y="74" width="12" height="12" rx="0.5"/>
    <rect x="40" y="74" width="26" height="12" rx="0.5"/>
    <rect x="70" y="74" width="10" height="12" rx="0.5"/>
  </g>

  <!-- River -->
  <path d="M-5 40 Q25 46 45 35 T95 42 T105 38" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.18" vector-effect="non-scaling-stroke"/>

  <!-- Parks -->
  <rect x="12" y="46" width="8" height="10" rx="2" fill="#22C55E" fill-opacity="0.10"/>
  <rect x="54" y="14" width="12" height="12" rx="2" fill="#22C55E" fill-opacity="0.10"/>
  <rect x="70" y="60" width="10" height="10" rx="2" fill="#22C55E" fill-opacity="0.10"/>

  <!-- 4 Dashed Amber Route Polylines - more visible -->
  <g fill="none" stroke="#F5A623" stroke-width="1.8" stroke-dasharray="2.5 4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.65" vector-effect="non-scaling-stroke">
    <polyline points="5,70 25,62 50,78 75,45 95,30"/>
    <polyline points="15,10 30,35 55,40 70,75 85,90"/>
    <polyline points="90,15 80,25 60,60 35,65 10,85"/>
    <polyline points="5,30 40,25 65,50 85,65 95,85"/>
  </g>

  <!-- Fixed Route Node Markers -->
  <g fill="#F5A623" fill-opacity="0.85">
    <circle cx="25" cy="62" r="1.4"/>
    <circle cx="55" cy="40" r="1.4"/>
    <circle cx="75" cy="45" r="1.4"/>
  </g>
</svg>
