<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Category - Japs Transfort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: headerNav('categories')}"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h4 class="fw-bold mb-0">Edit Category</h4>
                        <p class="text-muted small mb-0">Update category details</p>
                    </div>
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back to Categories
                    </a>
                </div>

                <div class="card table-card">
                    <div class="card-header table-header">
                        <h6 class="fw-bold mb-0"><i class="bi bi-pencil-square me-1"></i> Category Details</h6>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{'/admin/categories/edit/' + ${categoryDto.categoryId}}" th:object="${categoryDto}" method="post">
                            <input type="hidden" th:field="*{categoryId}">

                            <div class="mb-3">
                                <label for="editCategoryName" class="form-label small fw-medium">Category Name</label>
                                <input type="text"
                                       class="form-control"
                                       id="editCategoryName"
                                       th:field="*{name}"
                                       placeholder="Enter category name"
                                       th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Category name is required.
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm">
                                    Cancel
                                </a>
                                <button type="submit" class="btn btn-primary btn-sm">
                                    <i class="bi bi-check-lg me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
