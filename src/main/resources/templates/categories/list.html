<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: htmlHead('Categories')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Categories - Japs Transfort</title>
</head>
<body>
    <div class="app">
        <!-- Drawer backdrop for mobile screens -->
        <div class="sb-backdrop" onclick="window.jtToggleDrawer(false)" aria-hidden="true"></div>

        <!-- Sidebar -->
        <aside th:replace="~{fragments/layout :: sidebar('categories', 'admin')}"></aside>

        <!-- Main Content Area -->
        <div class="mw">
            <!-- Background effects -->
            <div th:replace="~{fragments/layout :: bgfx}"></div>

            <!-- Sticky Topbar -->
            <header th:replace="~{fragments/layout :: topbar('Categories', 'admin')}"></header>

            <main>
                <!-- Page Header -->
                <div class="jt-ph">
                    <div>
                        <h1>Categories</h1>
                        <div class="jt-sub">Group your products</div>
                    </div>
                    <div class="jt-ph-actions">
                        <a th:href="@{/dashboard}" class="jt-btn jt-btn-s">
                            <i class="bi bi-arrow-left me-1"></i> Dashboard
                        </a>
                    </div>
                </div>

                <!-- Feedback Alert Messages -->
                <div th:if="${successMessage}" class="jt-alert jt-alert-success alert alert-dismissible fade show" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}">Operation successful</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${errorMessage}" class="jt-alert jt-alert-danger alert alert-dismissible fade show" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">An error occurred</span>
                    </div>
                    <button type="button" class="btn-close jt-alert-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row g-4">
                    <!-- Add New Category Form (Left / Top) -->
                    <div class="col-12 col-lg-4">
                        <div class="jt-card">
                            <div class="jt-table-header">
                                <h6><i class="bi bi-plus-circle me-1"></i> Add Category</h6>
                            </div>
                            <div style="padding: 18px 20px;">
                                <form th:action="@{/admin/categories/create}" th:object="${categoryDto}" method="post">
                                    <div class="mb-3">
                                        <label for="categoryName" class="form-label" style="font-size: 13px; font-weight: 600; color: var(--tx);">Category Name</label>
                                        <input type="text"
                                               class="form-control"
                                               id="categoryName"
                                               th:field="*{name}"
                                               placeholder="e.g. Beverages, Everyday items"
                                               th:errorclass="is-invalid"
                                               required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                            Category name is required.
                                        </div>
                                    </div>
                                    <button type="submit" class="jt-btn jt-btn-p w-100">
                                        <i class="bi bi-check-lg me-1"></i> Save Category
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Categories Table (Right / Bottom) -->
                    <div class="col-12 col-lg-8">
                        <div class="jt-table-wrap" data-table-id="categories">
                            <div class="jt-table-header">
                                <div class="d-flex align-items-center gap-2">
                                    <h6><i class="bi bi-tag me-1"></i> Category List</h6>
                                    <span class="jt-badge-total" th:text="${categories.size()} + ' total'">0 total</span>
                                </div>
                                <div th:replace="~{fragments/layout :: tableControls('categories')}"></div>
                            </div>
                            <div class="jt-table-scroll">
                                <table class="jt-table jt-table-categories">
                                    <thead>
                                        <tr>
                                            <th scope="col" data-col="id" data-col-name="ID" style="width: 80px;">ID</th>
                                            <th scope="col" data-col="name" data-col-name="Name">Name</th>
                                            <th scope="col" data-col="actions" data-col-name="Actions" class="n">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:if="${#lists.isEmpty(categories)}">
                                            <td colspan="3" style="text-align: center; color: var(--mu); padding: 32px 16px;">
                                                No categories found. Create one using the form.
                                            </td>
                                        </tr>
                                        <tr th:each="cat : ${categories}">
                                            <td data-col="id" data-label="ID" style="font-family: monospace; font-size: 13px; font-weight: 600; color: var(--mu);" th:text="${cat.categoryId}">1</td>
                                            <td data-col="name" data-label="Name"><b th:text="${cat.name}">General</b></td>
                                            <td data-col="actions" data-label="Actions" class="n">
                                                <div class="jt-action-group justify-content-end">
                                                    <a th:href="@{'/admin/categories/edit/' + ${cat.categoryId}}"
                                                       class="jt-btn jt-btn-s"
                                                       title="Edit Category">
                                                        <i class="bi bi-pencil me-1"></i> Edit
                                                    </a>
                                                    <form th:action="@{'/admin/categories/delete/' + ${cat.categoryId}}"
                                                          method="post"
                                                          class="d-inline m-0 p-0"
                                                          onsubmit="return confirm('Are you sure you want to delete this category? Deletion will be rejected if any product belongs to this category.');">
                                                        <button type="submit" class="jt-btn jt-btn-s jt-btn-d" title="Delete Category">
                                                            <i class="bi bi-trash me-1"></i> Delete
                                                        </button>
                                                    </form>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Command Palette -->
        <div th:replace="~{fragments/layout :: commandPalette('admin')}"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
